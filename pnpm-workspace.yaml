# Single-app repo, but this file must declare "packages" even so: pnpm 9 treats any
# pnpm-workspace.yaml as a workspace manifest and fails the install outright with
# "packages field missing or empty". Vercel selects pnpm 9 from lockfileVersion 9.0,
# so omitting this breaks the deploy. Verified against pnpm 9 and pnpm 12.
packages:
  - "."

minimumReleaseAgeExclude:
  - '@babel/core@7.29.13'
  - '@babel/generator@7.29.13'
  - '@babel/helper-compilation-targets@7.29.13'
  - '@babel/helper-module-transforms@7.29.13'
  - '@babel/helpers@7.29.13'
  - '@babel/parser@7.29.13'
  - '@babel/traverse@7.29.13'
# Security overrides (Snyk / pnpm audit). pnpm >=11 reads overrides from here;
# pnpm <=10 reads them from "pnpm.overrides" in package.json, so the two lists are
# deliberately duplicated and MUST be kept in sync.
# Do not add a "packageManager" pin to package.json: it makes pnpm prepend a "---"
# document separator to pnpm-lock.yaml, which breaks Snyk's lockfile parser and
# makes `snyk test` silently report 0 issues.
overrides:
  "@types/react": "19.2.5"
  "@types/react-dom": "19.2.3"

  # Snyk: ReDoS / uncontrolled recursion / resource exhaustion in the glob-matching
  # chain pulled in by eslint-config-next's plugins.
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@2": "^2.1.7"
  "minimatch@3": "^3.1.5"
  "micromatch@4": "^4.0.8"
  "picomatch@2": "^2.3.2"

  # Snyk SNYK-JS-NANOID-18506897 (infinite loop), reached via next -> postcss.
  "nanoid@3": "^3.3.20"

  # Snyk: prototype pollution + unthrottled allocation, reached via
  # next -> styled-jsx -> @babel/core.
  "browserslist@4": "^4.29.5"
  "@babel/core@7": "^7.29.13"

  # Snyk SNYK-JS-MINIMATCH-22111072 (amplification); only fixed in 11.x,
  # and eslint 10 pins ^10.2.6.
  "minimatch@10": "^11.0.4"

  # Snyk SNYK-JS-DEEPMERGE-19964053 (prototype pollution). deepmerge has no fix;
  # html-to-text 10 replaced it with deepmerge-ts, so bump past @react-email's ^9 pin.
  "html-to-text@9": "^10.0.1"

  # GHSA: event-loop DoS in source-map-js <1.2.2, reached via postcss.
  "source-map-js": "^1.2.2"

  # NOTE: ajv@6 (via eslint 10) pulls uri-js 4.4.1, which has 3 unfixed advisories
  # (SNYK-JS-URIJS-19963961 / -19963963 / -20341609). ajv 8 drops uri-js for fast-uri,
  # but overriding ajv breaks eslint ("Cannot find module
  # 'ajv/lib/refs/json-schema-draft-04.json'"), so it is left in place. Dev-only, not
  # shipped to the browser or server bundle. Same for braces 3.0.3, which has no fix.
